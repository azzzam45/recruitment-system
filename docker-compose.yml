version: '3.8'

services:
  # API
  api:
    build: . 
    container_name: api-1
    ports:
      - "8002:8002"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=8002
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/recruitment_system_db?replicaSet=rs0
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    depends_on:
      - redis
      - mongo
      - elasticsearch

  # 2. (Redis)
  redis:
    image: redis:alpine 
    ports:
      - "6379:6379" 

  # 3. (MongoDB)
  mongo:
    image: mongo:latest
    container_name: mongo-1
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db

  # 3.1. (MongoDB Replica Set Init)
  mongo-init:
    image: mongo:latest
    container_name: mongo-init-1
    depends_on:
      - mongo
    command: >
      mongosh --host mongo:27017 --eval "
        try {
          rs.status().ok
        } catch (e) {
          rs.initiate({
            _id: 'rs0',
            members: [{ _id: 0, host: 'mongo:27017' }]
          })
        }
      "

  # 4.(Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch-1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

volumes:
  mongo-data: