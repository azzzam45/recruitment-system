<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: #007bff; margin: 0; font-size: 24px; }
        .logout-btn { background: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; }
        
        /* 🔍 Search Bar Styling */
        .search-container { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 12px 16px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.2); }

        .job-card { background: white; border: 1px solid #eee; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .job-title { margin: 0 0 10px 0; color: #333; }
        .badge { background: #17a2b8; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
        .apply-btn { background: #28a745; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; position: absolute; bottom: 20px; right: 20px; }
        .apply-btn:hover { background: #218838; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-top: 0; color: #007bff; }
        .modal-content input { width: 100%; padding: 10px; box-sizing: border-box; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-submit { background: #007bff; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; flex: 1; }
        .btn-cancel { background: #6c757d; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; flex: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Candidate Job Board 🎯</h1>
            <div>
                <span id="welcomeMsg" style="margin-right: 15px; font-weight: bold;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- 🔍 شريط البحث بـ Elasticsearch -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search jobs by title, company, skills, location..." oninput="handleSearch()">
        </div>

        <h2>Available Job Openings</h2>
        <div id="jobsList">Loading available jobs...</div>
    </div>

    <div id="applyModal" class="modal">
        <div class="modal-content">
            <h3>Apply for Job</h3>
            <p>Please provide a link to your resume (e.g., Google Drive or LinkedIn Link):</p>
            <input type="url" id="resumeUrl" placeholder="https://example.com/my-resume.pdf" required>
            <div class="modal-actions">
                <button class="btn-submit" onclick="submitApplication()">Submit Application</button>
                <button class="btn-cancel" onclick="closeApplyModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('welcomeMsg').textContent = `Welcome, ${localStorage.getItem('username') || 'Candidate'}`;
        const token = localStorage.getItem('token');
        let selectedJobId = "";
        let searchTimeout = null;

        window.onload = loadJobs;

        async function loadJobs(query = '') {
            const jobsList = document.getElementById('jobsList');
            try {
                const url = query.trim() 
                    ? `/api/jobs/search?q=${encodeURIComponent(query)}` 
                    : '/api/jobs';

                const response = await fetch(url);
                const data = await response.json();

                const jobs = data.jobs ? data.jobs : data;

                if (!Array.isArray(jobs) || jobs.length === 0) {
                    jobsList.innerHTML = "<p>No jobs found matching your request.</p>";
                    return;
                }

                renderJobs(jobs);
            } catch (err) {
                jobsList.innerHTML = `<p style="color: red;">Error fetching jobs: ${err.message}</p>`;
            }
        }

        function renderJobs(jobs) {
            const jobsList = document.getElementById('jobsList');
            jobsList.innerHTML = "";

            jobs.forEach(job => {
                const jobCard = document.createElement('div');
                jobCard.className = 'job-card';
                jobCard.innerHTML = `
                    <h3 class="job-title">${job.title}</h3>
                    <span class="badge">${job.company}</span>
                    <p>📍 <strong>Location:</strong> ${job.location}</p>
                    <p>🛠️ <strong>Requirements:</strong> ${Array.isArray(job.requirements) ? job.requirements.join(', ') : job.requirements}</p>
                    <button class="apply-btn" onclick="openApplyModal('${job._id}')">Apply Now</button>
                `;
                jobsList.appendChild(jobCard);
            });
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('searchInput').value;

            searchTimeout = setTimeout(() => {
                loadJobs(query);
            }, 100); 
        }

        function openApplyModal(jobId) {
            if (!token) {
                alert("Please log in to apply for this job.");
                window.location.href = '/login.html';
                return;
            }
            selectedJobId = jobId;
            document.getElementById('applyModal').style.display = 'flex';
        }

        function closeApplyModal() {
            document.getElementById('applyModal').style.display = 'none';
            document.getElementById('resumeUrl').value = "";
        }

        async function submitApplication() {
            const resumeUrl = document.getElementById('resumeUrl').value;

            if (!resumeUrl) {
                alert("Please enter your resume URL");
                return;
            }

            try {
                const response = await fetch('/api/applications', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ jobId: selectedJobId, resumeUrl })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(" Your application has been submitted successfully!");
                    closeApplyModal();
                } else {
                    alert(` Failed to apply: ${data.message}`);
                }
            } catch (err) {
                alert(`Connection Error: ${err.message}`);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
