<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Recruitment System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #007bff; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .footer-link a { color: #007bff; text-decoration: none; font-weight: bold; }
        .error-box { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-top: 15px; display: none; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Account Login</h2>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" value="azaam@example.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" value="password123" required>
        </div>
        <button onclick="handleLogin()">Sign In</button>
        
        <div class="footer-link">
            Don't have an account? <a href="/register.html">Create an account</a>
        </div>

        <div id="errorBox" class="error-box"></div>
    </div>

    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username);

                    if (data.user.role === 'recruiter') {
                        window.location.href = '/recruiter.html';
                    } else {
                        window.location.href = '/candidate.html';
                    }
                } else {
                    errorBox.textContent = `❌ ${data.message}`;
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = `Error: ${err.message}`;
                errorBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
